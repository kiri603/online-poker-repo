name: 🚀 斗地主一键自动部署 (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      privacy_only:
        description: '只发布画地为刃隐私政策'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: poker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.privacy_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poker-frontend/package-lock.json

      - name: 📦 前端依赖安装与打包
        run: |
          cd poker-frontend
          npm ci
          npm run build

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: maven

      - name: ⚙️ 后端测试与打包
        run: |
          cd poker
          mvn -B verify -Dlogging.level.com.game.poker=WARN

      - name: 准备发布文件和校验值
        run: |
          mkdir release
          cp poker/target/poker-0.0.1-SNAPSHOT.jar release/
          cp scripts/deploy-poker.sh scripts/WechatDataCheck.java release/
          tar -czf release/frontend.tar.gz -C poker-frontend/dist .
          cd release
          sha256sum poker-0.0.1-SNAPSHOT.jar frontend.tar.gz deploy-poker.sh WechatDataCheck.java > SHA256SUMS

      - name: 📤 上传构建产物到阿里云
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release/*"
          target: "/tmp/poker-release-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: 🔄 验证旧数据、备份并切换服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            stage=/tmp/poker-release-${{ github.run_id }}-${{ github.run_attempt }}
            if [ "$(id -u)" = 0 ]; then
              bash "$stage/deploy-poker.sh" "$stage"
            else
              sudo -n bash "$stage/deploy-poker.sh" "$stage"
            fi

  publish-tracebound-privacy:
    if: github.event_name == 'workflow_dispatch' && inputs.privacy_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 校验隐私政策
        run: |
          test -s tracebound-privacy/index.html
          cd tracebound-privacy
          sha256sum index.html > SHA256SUMS
      - name: 上传政策到独立临时目录
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'tracebound-privacy/index.html,tracebound-privacy/SHA256SUMS'
          target: '/tmp/tracebound-privacy-${{ github.run_id }}-${{ github.run_attempt }}'
          strip_components: 1
      - name: 创建独立网页目录
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 2m
          script: |
            set -eu
            stage=/tmp/tracebound-privacy-${{ github.run_id }}-${{ github.run_attempt }}
            target=/var/www/html/tracebound-privacy
            test "$(realpath -e /var/www/html)" = /var/www/html
            cd "$stage"
            sha256sum -c SHA256SUMS
            runroot() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo -n "$@"; fi; }
            if [ -d "$target" ] && [ ! -L "$target" ]; then
              test "$(realpath -e "$target")" = "$target"
              test -f "$target/index.html" && test ! -L "$target/index.html"
              printf '%s  %s\n' b9eecc0e6365eb58db73799642e3f238e9578065fa77cb5a57353ff36e060298 "$target/index.html" | sha256sum -c -
            else
              test ! -e "$target" && test ! -L "$target"
              runroot mkdir -- "$target"
              runroot chmod 0755 -- "$target"
            fi
            test ! -e "$target/index.html.tmp" && test ! -L "$target/index.html.tmp"
            runroot install -m 0644 -- index.html "$target/index.html.tmp"
            runroot mv -- "$target/index.html.tmp" "$target/index.html"
      - name: 核对公网政策内容
        run: |
          status=$(curl -sS --max-time 30 -o published.html -w '%{http_code}' https://sanguoddz.xyz/tracebound-privacy/)
          test "$status" = 200
          cmp tracebound-privacy/index.html published.html
