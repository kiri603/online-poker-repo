name: 🚀 斗地主一键自动部署 (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poker-frontend/package-lock.json

      - name: 📦 前端依赖安装与打包
        run: |
          cd poker-frontend
          npm ci
          npm run build

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: maven

      - name: ⚙️ 后端测试与打包
        run: |
          cd poker
          mvn -B verify -Dlogging.level.com.game.poker=WARN

      - name: 准备发布文件和校验值
        run: |
          mkdir release
          cp poker/target/poker-0.0.1-SNAPSHOT.jar release/
          cp scripts/deploy-poker.sh scripts/WechatDataCheck.java release/
          tar -czf release/frontend.tar.gz -C poker-frontend/dist .
          cd release
          sha256sum poker-0.0.1-SNAPSHOT.jar frontend.tar.gz deploy-poker.sh WechatDataCheck.java > SHA256SUMS

      - name: 📤 上传构建产物到阿里云
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release/*"
          target: "/tmp/poker-release-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: 🔄 验证旧数据、备份并切换服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            stage=/tmp/poker-release-${{ github.run_id }}-${{ github.run_attempt }}
            if [ "$(id -u)" = 0 ]; then
              bash "$stage/deploy-poker.sh" "$stage"
            else
              sudo -n bash "$stage/deploy-poker.sh" "$stage"
            fi
