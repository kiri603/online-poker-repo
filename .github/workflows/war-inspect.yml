name: War server inspection

on:
  push:
    branches: [codex/war]
    paths: [.github/workflows/war-inspect.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing server without changing services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 2m
          script: |
            set -eu
            printf 'SSH user: '; id -un
            printf 'System: '; uname -sm
            df -h /opt
            printf 'Node path: '; command -v node || true
            node --version 2>/dev/null || true
            printf 'Npm path: '; command -v npm || true
            if [ "$(id -u)" = 0 ]; then run_root() { "$@"; }; else run_root() { sudo -n "$@"; }; fi
            run_root systemctl is-active nginx
            run_root ss -ltnp
            run_root python3 - <<'PY'
            import pathlib,re
            for path in sorted(pathlib.Path('/etc/nginx/sites-enabled').glob('*')):
                if not path.is_file(): continue
                print('NGINX_SITE',path,'TARGET',path.resolve())
                for line in path.read_text().splitlines():
                    clean=line.strip()
                    if re.match(r'^(server\s*\{|listen\s|server_name\s|root\s|location\s|proxy_pass\s|include\s)',clean):
                        print(clean)
            print('DOMAIN_CONFIG_BEGIN')
            print(pathlib.Path('/etc/nginx/sites-available/sanguoddz.xyz').read_text())
            print('DOMAIN_CONFIG_END')
            PY
